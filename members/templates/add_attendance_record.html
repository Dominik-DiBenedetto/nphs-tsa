<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Attendance Record</title>

    {% load static %}
    {% load pwa %}
    {% load mycomponents %}
    {% progressive_web_app_meta %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'css/manual_attendance_add.css' %}" />
</head>
<body>
    {% navbar "none" "Attendance" %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="N Number">N Number:</label>
            <input type="text" name="n_num" />
        </div>
        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" name="date" value="{{date}}" />
        </div>
        <button type="submit">Add Attendance Record</button>
    </form>
    <script>
        if ( window.history.replaceState ) {
            window.history.replaceState( null, null, window.location.href );
        }
    </script>
</body>
</html>
