<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notification | NPHS TSA</title>

    {% load static %}
    {% load pwa %}
    {% progressive_web_app_meta %}
    {% load mycomponents %}
    {% load is_officer %}
    <link
        rel="icon"
        href="{% static 'images/nphs_bobcats_favicon.jpg' %}"
        type="image/x-icon"
    />

    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'css/send_notif.css' %}" />
    <script src="{% static 'javascript/send_notification.js' %}" defer></script>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getMessaging, onRegistered, register } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyC7f-ZoEsun8PH2V0oqnJNnM6HvsZWXvBY",
            authDomain: "nphs-tsa-notifications.firebaseapp.com",
            projectId: "nphs-tsa-notifications",
            storageBucket: "nphs-tsa-notifications.firebasestorage.app",
            messagingSenderId: "552786080626",
            appId: "1:552786080626:web:d76402d87805c3cd5a23eb",
            measurementId: "G-9TBS5HQM01"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app)

        function requestPermission() {
            console.log('Requesting permission...');
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    console.log('Notification permission granted.');
                }
            });
        }

        const getCSRF = () => {
            const match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : null;
        };

        const saveToken = (token) => {
            fetch('save-fcm-token/', { // Here update the API endpoint as per your setup.
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRF(),
                },
                credentials: 'include',
                body: JSON.stringify({ token })
            })
            .then(res => res.json())
            .then(data => console.log('Token saved:', data))
            .catch(err => console.error('Save failed:', err));
        };

        // 1. Implement callback to receive the Firebase installation ID upon registration.
        // This is triggered every time a manual register() finishes, a FID change
        // is detected, or a pushsubscriptionchange event is fired.
        onRegistered(messaging, (installationId) => {
            console.log('Registered installation ID:', installationId);

            // Send the Firebase Installation ID to your app server and update the UI if needed.
            // sendRegistrationToServer(installationId);
            saveToken(installationId)
        });

        // // 2. You can also manually trigger registration (recommended on app startup)
        register(messaging, {
            vapidKey: 'BDGqGOEFrlRoo6WUUv7GZ4_2bXCWmLKdQmwl9qEYpCV0DSeF3H-GJNTyTrIHG0iV_z2_ZuEp1cjhOuNUzdvwil0'
        }).then(() => {
            // Success! The Firebase Installation ID can be used to target messages to this app
            // instance and will be delivered asynchronously to your onRegistered() callback.
        }).catch((err) => {
            console.error('An error occurred while registering', err);
        });
    </script>
    <style>
        
    </style>
</head>
<body>
    {% navbar "none" "Members" %}
    <form id="notif-form">
        <div class="form-group">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-input" id="title">
        </div>
        <div class="form-group">
            <label class="form-label" for="Body">Body</label>
            <input type="text" class="form-input" id="Body">
        </div>
        <div class="form-group">
            <label class="form-label" for="recipients">Recipient(s)</label>
            <select type="password" class="form-input" id="recipients" value="">
                <option class="recipient">All</option>
            </select>
        </div>
        <div class="modal-actions">
            <button type="submit" class="btn btn-primary form-input">Send</button>
        </div>
    </form>
</body>
</html>
